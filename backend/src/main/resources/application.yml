server:
  port: ${PORT:9090}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAMESITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5174}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: gitinbits-poc

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gitinbits}

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-120b}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            # Scopes required:
            #   read:user  → /user endpoint (authenticated user profile)
            #   read:org   → /user/orgs, /orgs/{org}, /orgs/{org}/members, /orgs/{org}/teams
            #   repo       → access to private + public repos; commits, branches, PRs, issues, etc.
            scope:
              - read:user
              - read:org
              - repo
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ─── GitHub API Configuration ─────────────────────────────────────────────────
github:
  base-url: https://api.github.com
  api-version: "2022-11-28"

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.gitinbits: INFO
    org.springframework.security: INFO
    org.springframework.web.client: INFO
